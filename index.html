<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cose da fare</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; background: #fafafa; color: #222; }
    h1 { font-size: 1.6rem; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 14px; font-size: 1rem; cursor: pointer; }
    li { padding: 6px 0; cursor: pointer; }
    li.fatto { text-decoration: line-through; color: #999; }
  </style>
</head>
<body>
  <h1>Cose da fare</h1>
  <form id="form">
    <input id="testo" placeholder="Scrivi una cosa da fare..." autofocus>
    <button>Aggiungi</button>
  </form>
  <ul id="lista"></ul>
  <p id="conteggio">Nessuna cosa da fare</p>

  <script>
    const form = document.getElementById('form');
    const testo = document.getElementById('testo');
    const lista = document.getElementById('lista');
    const conteggio = document.getElementById('conteggio');

    const CHIAVE = 'cose-da-fare';

    function aggiornaConteggio() {
      const restanti = lista.querySelectorAll('li:not(.fatto)').length;
      conteggio.textContent = restanti === 0 ? 'Nessuna cosa da fare'
        : restanti === 1 ? 'Ti resta 1 cosa da fare'
        : `Ti restano ${restanti} cose da fare`;
    }

    // Salva la lista nel browser, così resta anche dopo aver ricaricato la pagina
    function salva() {
      const voci = [...lista.children].map((li) => ({
        testo: li.textContent,
        fatto: li.classList.contains('fatto'),
      }));
      try { localStorage.setItem(CHIAVE, JSON.stringify(voci)); } catch {}
    }

    function carica() {
      try { return JSON.parse(localStorage.getItem(CHIAVE)) || []; } catch { return []; }
    }

    function aggiungiVoce(testoVoce, fatto) {
      const li = document.createElement('li');
      li.textContent = testoVoce;
      if (fatto) li.classList.add('fatto');
      li.addEventListener('click', () => {
        li.classList.toggle('fatto');
        aggiornaConteggio();
        salva();
      });
      lista.appendChild(li);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!testo.value.trim()) return;
      aggiungiVoce(testo.value, false);
      testo.value = '';
      aggiornaConteggio();
      salva();
    });

    carica().forEach((voce) => aggiungiVoce(voce.testo, voce.fatto));
    aggiornaConteggio();
  </script>
</body>
</html>
