<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cose da fare</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; background: #fafafa; color: #222; }
    h1 { font-size: 1.6rem; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 14px; font-size: 1rem; cursor: pointer; }
    ul { padding-left: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; cursor: text; }
    li .modifica { flex: 1; padding: 4px; }
    li.fatto span { text-decoration: line-through; color: #999; }
    .elimina { padding: 2px 8px; border: none; background: none; color: #c33; font-size: 1.1rem; }
    .elimina:hover { background: #fdeaea; border-radius: 4px; }
    #filtri { display: flex; gap: 6px; margin-top: 16px; }
    #filtri button { font-size: 0.9rem; padding: 4px 10px; }
    #filtri button.attivo { font-weight: bold; }
    #lista[data-filtro="dafare"] li.fatto,
    #lista[data-filtro="fatte"] li:not(.fatto) { display: none; }
    #fondo { display: flex; justify-content: space-between; align-items: center; color: #555; }
    #svuota { font-size: 0.9rem; padding: 6px 10px; }
  </style>
</head>
<body>
  <h1>Cose da fare</h1>
  <form id="form">
    <input id="testo" placeholder="Scrivi una cosa da fare..." autofocus>
    <button>Aggiungi</button>
  </form>
  <div id="filtri">
    <button data-filtro="tutte" class="attivo">Tutte</button>
    <button data-filtro="dafare">Da fare</button>
    <button data-filtro="fatte">Completate</button>
  </div>
  <ul id="lista" data-filtro="tutte"></ul>
  <div id="fondo">
    <p id="conteggio">Nessuna cosa da fare</p>
    <button id="svuota" hidden>Svuota completate</button>
  </div>

  <script>
    const form = document.getElementById('form');
    const testo = document.getElementById('testo');
    const lista = document.getElementById('lista');
    const conteggio = document.getElementById('conteggio');
    const svuota = document.getElementById('svuota');

    const CHIAVE = 'cose-da-fare';

    function aggiornaConteggio() {
      const restanti = lista.querySelectorAll('li:not(.fatto)').length;
      conteggio.textContent = restanti === 0 ? 'Nessuna cosa da fare'
        : restanti === 1 ? 'Ti resta 1 cosa da fare'
        : `Ti restano ${restanti} cose da fare`;
      // Il pulsante compare solo se c'è almeno una voce completata
      svuota.hidden = !lista.querySelector('li.fatto');
    }

    // Salva la lista nel browser, così resta anche dopo aver ricaricato la pagina
    function salva() {
      const voci = [...lista.children].map((li) => ({
        testo: li.querySelector('span').textContent,
        fatto: li.classList.contains('fatto'),
      }));
      try { localStorage.setItem(CHIAVE, JSON.stringify(voci)); } catch {}
    }

    function carica() {
      try { return JSON.parse(localStorage.getItem(CHIAVE)) || []; } catch { return []; }
    }

    function aggiungiVoce(testoVoce, fatto) {
      const li = document.createElement('li');
      if (fatto) li.classList.add('fatto');

      const casella = document.createElement('input');
      casella.type = 'checkbox';
      casella.checked = fatto;
      casella.title = 'Segna come fatta';
      casella.addEventListener('change', () => {
        li.classList.toggle('fatto', casella.checked);
        aggiornaConteggio();
        salva();
      });

      const span = document.createElement('span');
      span.textContent = testoVoce;
      span.title = 'Doppio clic per modificare';
      span.addEventListener('dblclick', () => modificaVoce(li, span));

      const elimina = document.createElement('button');
      elimina.className = 'elimina';
      elimina.textContent = '✕';
      elimina.title = 'Elimina';
      elimina.addEventListener('click', () => {
        li.remove();
        aggiornaConteggio();
        salva();
      });

      li.append(casella, span, elimina);
      lista.appendChild(li);
    }

    // Sostituisce il testo con un campo modificabile: Invio salva, Esc annulla
    function modificaVoce(li, span) {
      const campo = document.createElement('input');
      campo.className = 'modifica';
      campo.value = span.textContent;
      span.replaceWith(campo);
      campo.focus();
      campo.select();

      let finito = false;
      function chiudi(conferma) {
        if (finito) return;
        finito = true;
        const nuovo = campo.value.trim();
        if (conferma && !nuovo) {
          // Se il testo è stato cancellato, elimina la voce
          li.remove();
        } else {
          if (conferma) span.textContent = nuovo;
          campo.replaceWith(span);
        }
        aggiornaConteggio();
        salva();
      }

      campo.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') chiudi(true);
        if (e.key === 'Escape') chiudi(false);
      });
      campo.addEventListener('blur', () => chiudi(true));
    }

    // I filtri nascondono le voci con il CSS, senza toglierle dalla lista
    const filtri = document.getElementById('filtri');
    filtri.addEventListener('click', (e) => {
      const pulsante = e.target.closest('button');
      if (!pulsante) return;
      filtri.querySelectorAll('button').forEach((b) => b.classList.toggle('attivo', b === pulsante));
      lista.dataset.filtro = pulsante.dataset.filtro;
    });

    svuota.addEventListener('click', () => {
      lista.querySelectorAll('li.fatto').forEach((li) => li.remove());
      aggiornaConteggio();
      salva();
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!testo.value.trim()) return;
      aggiungiVoce(testo.value, false);
      testo.value = '';
      aggiornaConteggio();
      salva();
    });

    carica().forEach((voce) => aggiungiVoce(voce.testo, voce.fatto));
    aggiornaConteggio();
  </script>
</body>
</html>
